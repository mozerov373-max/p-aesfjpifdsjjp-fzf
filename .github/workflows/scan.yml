name: AES scanner

on:
  schedule:
    - cron: "50 5 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "test или scan"
        default: "test"
        type: choice
        options: [test, scan]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py ${{ github.event.inputs.mode == 'test' && '--test' || '' }}
